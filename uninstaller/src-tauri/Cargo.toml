[package]
name = "uninstOpenMD"
version = "10.0.0"
description = "OpenMD Uninstaller"
authors = ["MuLiu"]
edition = "2021"

[lib]
name = "uninst_openmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openmd-shell-verb = { path = "../../crates/openmd-shell-verb" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
dirs = "5"

# MSVC link.exe 的本地化提示（如"正在创建库..."）会被透传为警告，这里关闭
[lints.rust]
linker_messages = "allow"
